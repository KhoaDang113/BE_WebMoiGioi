name: CI/CD Docker Hub Backend

on:
  push:
    branches:
      - main # Chạy tự động mỗi khi bạn push code lên nhánh main
      - develop
      - cicd/setup

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Sử dụng Action lấy code từ Github (Checkout)
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Thiết lập Docker Buildx (Công cụ build mạnh mẽ hơn của Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Sử dụng Action Đăng nhập Docker Hub (Docker Login)
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Sử dụng Action Đóng gói & Đẩy Image (Build and push Docker images)
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Cache lại các layer Docker (giúp npm ci lần 2 nhanh như chớp)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Gắn tags cho image (nhớ thay 'be-webmoigioi' bằng tên repository trên Docker Hub của bạn)
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/be-webmoigioi:latest
            ${{ secrets.DOCKER_USERNAME }}/be-webmoigioi:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/develop' || 
      github.ref == 'refs/heads/cicd/setup'

    steps:
      - name: Deploy Backend to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Di chuyển vào thư mục chứa dự án trên VPS 
            cd ~/bds
            
            # Kéo image mới nhất của BE từ Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/be-webmoigioi:latest
            
            # Dừng và Xoá container cũ nếu có
            docker stop be_webmoigioi_container || true
            docker rm be_webmoigioi_container || true
            
            # Khởi động container mới - Ánh xạ cổng 3000 và truyền file .env từ VPS
            docker run -d \
              --name be_webmoigioi_container \
              -p 3000:3000 \
              --env-file .env \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/be-webmoigioi:latest
            
            # In ra màn hình console để kiểm tra nó đang chạy
            docker ps | grep be_webmoigioi_container
            
            # Xoá bớt cái Image cũ để tránh bị báo lỗi đầy ổ cứng VPS
            docker image prune -f
